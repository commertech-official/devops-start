---
# tasks file for ./roles/myrole1

- name: Ensure that vim editor installed.
  apt:
    name: 
      - vim
      - nano
    state: present
    update_cache: yes
  
- name: Install apache httpd  (state=present is optional)
  ansible.builtin.apt:
    name: apache2
    state: present

- name: modeule debug
  debug:
    msg: "{{ ansible_facts.all_ipv4_addresses }}"