version: '3.1'

services:
  pushgateway:
    image: prom/pushgateway:latest
    container_name: aleshkin-da-netology-pushgateway
    ports:
      - "9091:9091"
    networks:
      - aleshkin-da-my-netology-hw
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: aleshkin-da-netology-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - aleshkin-da-my-netology-hw
    restart: unless-stopped
    depends_on:
      - pushgateway
      - alertmanager

  grafana:
    image: grafana/grafana:latest
    container_name: aleshkin-da-netology-grafana
    volumes:
      - ./grafana-custom.ini:/etc/grafana/grafana.ini:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_CONFIG_FILE=/etc/grafana/grafana.ini
    ports:
      - "80:3000"
    networks:
      - aleshkin-da-my-netology-hw
    restart: unless-stopped
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:latest
    container_name: aleshkin-da-netology-alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - aleshkin-da-my-netology-hw
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  aleshkin-da-my-netology-hw:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16